# Grafo de habilidades — Matemáticas
#
# Cada nodo es una habilidad atómica. Las flechas (prerequisitos) dicen qué va
# antes de qué. El planificador navega esto; no hay orden fijo de temario.
#
# Los tres anclajes están verificados contra los documentos primarios y auditados
# uno por uno en `FUENTES.md` §2.5 (13 nodos: 3 confirmados, 10 corregidos).
# El formato `DBA Matemáticas 2° · #3` cita el DBA por su número, que es lo que
# lo hace verificable: una descripción libre no se puede contrastar con nada.
#
# ⚠️ Lo que sigue SIN verificar, y por eso se dice acá en vez de completarse:
#    · La memoria de tablas hasta 10×10 (`mat.multiplicacion.tablas`) NO la exige
#      el MEN. Viene de Core Knowledge G3 y de Singapur P2/P3. Es decisión nuestra.
#    · Los topes numéricos ("hasta 100", "hasta 999") tampoco son del MEN.
#    · Falta confirmar la licencia de uso de Core Knowledge.
#
# El campo `en` queda vacío hasta la fase de inglés — ver ARCHITECTURE.md §7.

# ═══════════════════════════════════════════════════════════════════════════
# Cimientos (arrastre de 1°)
# ═══════════════════════════════════════════════════════════════════════════

- id: mat.numeros.conteo_hasta_100
  nombre:
    es: "Contar hasta 100"
  descripcion:
    es: "Cuenta, lee y escribe números hasta 100, y reconoce el orden de la secuencia numérica."
  materia: matematicas
  grado_sugerido: 1
  # Depende del 20 desde el 20/08. Antes era la raíz del grafo porque no había
  # nada debajo: a un niño que empieza 1° se le ofrecía contar hasta 100 como
  # primera cosa. El grafo vuelve a tener una sola raíz, y ahora es la de verdad.
  prerequisitos:
    - mat.numeros.conteo_hasta_20
  alineacion:
    dba_colombia: "DBA Matemáticas 1° · #2"
    ebc_colombia: "EBC Matemáticas 1°-3° · «Reconozco significados del número en diferentes contextos»"
    core_knowledge: "Grade 1 Mathematics — Numbers and Number Sense"
  verificable_en_codigo: true

- id: mat.numeros.valor_posicional_decenas
  nombre:
    es: "Decenas y unidades"
  descripcion:
    es: "Entiende que en un número de dos cifras la primera vale decenas y la segunda unidades; descompone 47 como 4 decenas y 7 unidades."
  materia: matematicas
  grado_sugerido: 1
  prerequisitos:
    - mat.numeros.conteo_hasta_100
  alineacion:
    dba_colombia: "DBA Matemáticas 1° · #3"
    ebc_colombia: "EBC Matemáticas 1°-3° · «Uso representaciones —principalmente concretas y pictóricas— para explicar el valor de posición en el sistema de numeración decimal»"
    core_knowledge: "Grade 1 Mathematics — Place value: ones, tens, hundreds"
  verificable_en_codigo: true

# ═══════════════════════════════════════════════════════════════════════════
# Sistema numérico (2°)
# ═══════════════════════════════════════════════════════════════════════════

- id: mat.numeros.valor_posicional_centenas
  nombre:
    es: "Centenas"
  descripcion:
    es: "Extiende el valor posicional a números de tres cifras; descompone 352 como 3 centenas, 5 decenas y 2 unidades."
  materia: matematicas
  grado_sugerido: 2
  prerequisitos:
    - mat.numeros.valor_posicional_decenas
  alineacion:
    dba_colombia: "DBA Matemáticas 2° · #3"
    ebc_colombia: "EBC Matemáticas 1°-3° · «…realizar equivalencias de un número en las diferentes unidades del sistema decimal»"
    core_knowledge: "Grade 2 Mathematics — Place value: ones, tens, hundreds, thousands"
  verificable_en_codigo: true

- id: mat.numeros.comparar_ordenar
  nombre:
    es: "Comparar y ordenar números"
  descripcion:
    es: "Compara dos números de hasta tres cifras usando mayor que, menor que e igual, y ordena una serie de menor a mayor."
  materia: matematicas
  grado_sugerido: 2
  prerequisitos:
    - mat.numeros.valor_posicional_centenas
  alineacion:
    dba_colombia: "DBA Matemáticas 2° · #3"
    ebc_colombia: "EBC Matemáticas 1°-3° · «Describo, comparo y cuantifico situaciones con números, en diferentes contextos y con diversas representaciones»"
    core_knowledge: "Grade 2 Mathematics — Comparing and ordering numbers"
  verificable_en_codigo: true

# ═══════════════════════════════════════════════════════════════════════════
# Suma (2°)
# ═══════════════════════════════════════════════════════════════════════════

- id: mat.suma.sin_reagrupacion
  nombre:
    es: "Suma sin llevar"
  descripcion:
    es: "Suma dos números de dos cifras cuando ninguna columna pasa de 9, sumando unidades con unidades y decenas con decenas."
  materia: matematicas
  grado_sugerido: 2
  prerequisitos:
    - mat.numeros.valor_posicional_decenas
  alineacion:
    dba_colombia: "DBA Matemáticas 2° · #2"
    ebc_colombia: "EBC Matemáticas 1°-3° · «Uso diversas estrategias de cálculo (especialmente cálculo mental) y de estimación para resolver problemas en situaciones aditivas y multiplicativas»"
    core_knowledge: "Grade 2 Mathematics — Addition without regrouping"
  verificable_en_codigo: true

- id: mat.suma.con_reagrupacion
  nombre:
    es: "Suma llevando"
  descripcion:
    es: "Suma dos números de dos cifras cuando las unidades pasan de 9, reagrupando diez unidades en una decena."
  materia: matematicas
  grado_sugerido: 2
  prerequisitos:
    - mat.suma.sin_reagrupacion
    - mat.numeros.valor_posicional_decenas
  alineacion:
    dba_colombia: "DBA Matemáticas 2° · #2"
    ebc_colombia: "EBC Matemáticas 1°-3° · «Uso diversas estrategias de cálculo (especialmente cálculo mental) y de estimación para resolver problemas en situaciones aditivas y multiplicativas»"
    core_knowledge: "Grade 2 Mathematics — Addition with regrouping"
  verificable_en_codigo: true

# ═══════════════════════════════════════════════════════════════════════════
# Resta (2°)
# ═══════════════════════════════════════════════════════════════════════════

- id: mat.resta.sin_desagrupacion
  nombre:
    es: "Resta sin prestar"
  descripcion:
    es: "Resta dos números de dos cifras cuando cada cifra de arriba es mayor o igual que la de abajo."
  materia: matematicas
  grado_sugerido: 2
  prerequisitos:
    - mat.numeros.valor_posicional_decenas
  alineacion:
    dba_colombia: "DBA Matemáticas 2° · #2"
    ebc_colombia: "EBC Matemáticas 1°-3° · «Uso diversas estrategias de cálculo (especialmente cálculo mental) y de estimación para resolver problemas en situaciones aditivas y multiplicativas»"
    core_knowledge: "Grade 2 Mathematics — Subtraction without regrouping"
  verificable_en_codigo: true

- id: mat.resta.con_desagrupacion
  nombre:
    es: "Resta prestando"
  descripcion:
    es: "Resta dos números de dos cifras cuando hay que desagrupar una decena en diez unidades para poder restar."
  materia: matematicas
  grado_sugerido: 2
  prerequisitos:
    - mat.resta.sin_desagrupacion
    - mat.numeros.valor_posicional_decenas
  alineacion:
    dba_colombia: "DBA Matemáticas 2° · #2"
    ebc_colombia: "EBC Matemáticas 1°-3° · «Uso diversas estrategias de cálculo (especialmente cálculo mental) y de estimación para resolver problemas en situaciones aditivas y multiplicativas»"
    core_knowledge: "Grade 2 Mathematics — Subtraction with regrouping"
  verificable_en_codigo: true

# ═══════════════════════════════════════════════════════════════════════════
# Aplicación (2°)
# ═══════════════════════════════════════════════════════════════════════════

- id: mat.problemas.suma_resta
  nombre:
    es: "Problemas de suma y resta"
  descripcion:
    es: "Lee un problema en palabras, decide si hay que sumar o restar, y resuelve. Lo difícil no es la cuenta: es elegir la operación."
  materia: matematicas
  grado_sugerido: 2
  prerequisitos:
    - mat.suma.con_reagrupacion
    - mat.resta.con_desagrupacion
  alineacion:
    dba_colombia: "DBA Matemáticas 2° · #1"
    ebc_colombia: "EBC Matemáticas 1°-3° · «Resuelvo y formulo problemas en situaciones aditivas de composición y de transformación»"
    core_knowledge: "Grade 2 Mathematics — Word problems"
  verificable_en_codigo: true

- id: mat.multiplicacion.grupos_iguales
  nombre:
    es: "Multiplicar como grupos iguales"
  descripcion:
    es: "Entiende la multiplicación como sumar varias veces el mismo número: 4 bolsas de 3 manzanas es 3+3+3+3, o sea 4×3."
  materia: matematicas
  grado_sugerido: 2
  prerequisitos:
    - mat.suma.con_reagrupacion
  alineacion:
    dba_colombia: "DBA Matemáticas 2° · #1 y #2"
    ebc_colombia: "EBC Matemáticas 1°-3° · «Uso diversas estrategias de cálculo (especialmente cálculo mental) y de estimación para resolver problemas en situaciones aditivas y multiplicativas»"
    core_knowledge: "Grade 2 Mathematics — Introduction to Multiplication"
  verificable_en_codigo: true

# ═══════════════════════════════════════════════════════════════════════════
# Cabeza de pista (3°) — SIN TECHO
#
# Estos nodos existen para que un niño de 2° que avanza rápido tenga a dónde
# seguir. El grado es una etiqueta, no un límite: si tiene los prerrequisitos,
# el planificador se lo ofrece. Ver ARCHITECTURE.md §11.
# ═══════════════════════════════════════════════════════════════════════════

- id: mat.multiplicacion.tablas
  nombre:
    es: "Tablas de multiplicar"
  descripcion:
    es: "Recuerda de memoria los productos hasta 10×10 y los usa para resolver sin contar de a uno."
  materia: matematicas
  grado_sugerido: 3
  prerequisitos:
    - mat.multiplicacion.grupos_iguales
  alineacion:
    dba_colombia: "DBA Matemáticas 3° · #1"
    ebc_colombia: "EBC Matemáticas 1°-3° · «Uso diversas estrategias de cálculo (especialmente cálculo mental) y de estimación para resolver problemas en situaciones aditivas y multiplicativas»"
    core_knowledge: "Grade 3 Mathematics — Master basic multiplication facts to 10 × 10"
  verificable_en_codigo: true

- id: mat.division.reparto_equitativo
  nombre:
    es: "Dividir repartiendo en partes iguales"
  descripcion:
    es: "Entiende la división como repartir en grupos iguales y la reconoce como la operación inversa de multiplicar."
  materia: matematicas
  # Bajado de 3° a 2° el 20/08. El MEN nombra "reparto equitativo" LITERALMENTE
  # en el DBA 2° #2, un grado antes de donde lo teníamos (FUENTES.md §2.2).
  #
  # Y el prerrequisito pasó de las diez tablas a las tres fáciles: exigir que se
  # sepa la tabla del 7 para entender qué es repartir es pedir demasiado, y
  # contradice el consenso de las cuatro fuentes — multiplicación y división se
  # enseñan emparejadas, no separadas por un grado (FUENTES.md §3.5).
  grado_sugerido: 2
  prerequisitos:
    - mat.multiplicacion.tablas_2_5_10
  alineacion:
    dba_colombia: "DBA Matemáticas 2° · #2 — «multiplicación o reparto equitativo», literal"
    ebc_colombia: "EBC Matemáticas 1°-3° · «Uso diversas estrategias de cálculo (especialmente cálculo mental) y de estimación para resolver problemas en situaciones aditivas y multiplicativas»"
    core_knowledge: "Grade 3 Mathematics — Division"
  verificable_en_codigo: true

- id: mat.fracciones.medios_tercios_cuartos
  nombre:
    es: "Fracciones simples"
  descripcion:
    es: "Reconoce medios, tercios y cuartos como partes iguales de un entero, y los compara entre sí."
  materia: matematicas
  grado_sugerido: 3
  prerequisitos:
    - mat.division.reparto_equitativo
  alineacion:
    dba_colombia: "DBA Matemáticas 3° · #3"
    ebc_colombia: "EBC Matemáticas 1°-3° · «Describo situaciones de medición utilizando fracciones comunes»"
    core_knowledge: "Grade 1-2 Mathematics — Fractions as part of a whole: 1/2, 1/3, 1/4"
  verificable_en_codigo: true

# ═══════════════════════════════════════════════════════════════════════════
# Los 41 nodos de FUENTES.md §7.1, transcritos el 2026-08-20.
#
# Cubren el pensamiento numérico del MEN de 1° a 5°. NO hay geometría, medición
# ni estadística: están fuera del alcance declarado del producto (lectura,
# escritura y aritmética), y el MEN sí los tiene — el hueco es deliberado.
#
# Los anclajes salen de la auditoría contra los PDF primarios. Donde no hay DBA
# se dice: el campo queda ausente y se apoya en el Estándar o en Core Knowledge.
# ═══════════════════════════════════════════════════════════════════════════

# ── 1° — los cimientos que faltaban ────────────────────────────────────────
# Hoy el grafo arrancaba en "contar hasta 100", que para un niño de 1° es la
# mitad del año. Sin estos nueve, un chico que recién empieza no tiene por dónde
# entrar y el planificador le ofrece lo único que hay: algo que le queda grande.

- id: mat.numeros.conteo_hasta_20
  nombre:
    es: "Contar hasta 20"
  descripcion:
    es: "Cuenta, lee y escribe los números hasta 20, y sabe cuál va antes y cuál después."
  materia: matematicas
  grado_sugerido: 1
  prerequisitos: []
  alineacion:
    dba_colombia: "DBA Matemáticas 1° · #2"
    ebc_colombia: "EBC Matemáticas 1°-3° · «Reconozco significados del número en diferentes contextos»"
    core_knowledge: "Grade K Mathematics — Numbers and Number Sense"
  verificable_en_codigo: true

- id: mat.numeros.ordinales
  nombre:
    es: "Primero, segundo, tercero"
  descripcion:
    es: "Usa los ordinales para decir en qué lugar está algo: el tercero de la fila, el quinto piso."
  materia: matematicas
  grado_sugerido: 1
  prerequisitos:
    - mat.numeros.conteo_hasta_20
  alineacion:
    dba_colombia: "DBA Matemáticas 1° · #1"
    ebc_colombia: "EBC Matemáticas 1°-3° · «Reconozco significados del número (medición, conteo, comparación, codificación, localización)»"
  verificable_en_codigo: true

- id: mat.numeros.conteo_saltado
  nombre:
    es: "Contar de 2 en 2, de 5 en 5 y de 10 en 10"
  descripcion:
    es: "Cuenta saltando desde cualquier número: 2, 4, 6… o 30, 40, 50. Es el puente hacia multiplicar."
  materia: matematicas
  grado_sugerido: 1
  prerequisitos:
    - mat.numeros.conteo_hasta_100
  alineacion:
    dba_colombia: "DBA Matemáticas 1° · #2 — evidencia literal: «de 1 en 1, de 2 en 2, de 5 en 5»"
    ebc_colombia: "EBC Matemáticas 1°-3° · «Reconozco y describo regularidades y patrones en distintos contextos»"
  verificable_en_codigo: true

- id: mat.numeros.recta_numerica
  nombre:
    es: "Ubicar números en la recta"
  descripcion:
    es: "Encuentra dónde va un número en la recta y usa eso para ver cuál es mayor y cuánto hay entre dos."
  materia: matematicas
  grado_sugerido: 1
  prerequisitos:
    - mat.numeros.conteo_hasta_100
  alineacion:
    dba_colombia: "DBA Matemáticas 1° · #3"
    ebc_colombia: "EBC Matemáticas 1°-3° · «Describo, comparo y cuantifico situaciones con números»"
  verificable_en_codigo: true

- id: mat.suma.hechos_hasta_10
  nombre:
    es: "Sumas básicas hasta 10"
  descripcion:
    es: "Resuelve de memoria las sumas cuyo resultado no pasa de 10, sin contar con los dedos."
  materia: matematicas
  grado_sugerido: 1
  prerequisitos:
    - mat.numeros.conteo_hasta_20
  alineacion:
    dba_colombia: "DBA Matemáticas 1° · #2"
    ebc_colombia: "EBC Matemáticas 1°-3° · «Uso diversas estrategias de cálculo (especialmente cálculo mental)»"
    core_knowledge: "Grade 1 Mathematics — Addition facts to 10"
  verificable_en_codigo: true

- id: mat.suma.hechos_hasta_20
  nombre:
    es: "Sumas básicas hasta 20"
  descripcion:
    es: "Suma hasta 20 usando el paso por el diez: 8 + 5 es 8 + 2 + 3."
  materia: matematicas
  grado_sugerido: 1
  prerequisitos:
    - mat.suma.hechos_hasta_10
  alineacion:
    dba_colombia: "DBA Matemáticas 1° · #2 — evidencia literal: «el paso por el diez»"
    core_knowledge: "Grade 1 Mathematics — Addition facts to 20"
  verificable_en_codigo: true

- id: mat.resta.hechos_basicos
  nombre:
    es: "Restas básicas hasta 20"
  descripcion:
    es: "Resta dentro del 20 apoyándose en las sumas que ya sabe: si 8 + 5 son 13, entonces 13 − 5 son 8."
  materia: matematicas
  grado_sugerido: 1
  prerequisitos:
    - mat.suma.hechos_hasta_20
  alineacion:
    dba_colombia: "DBA Matemáticas 1° · #2"
    core_knowledge: "Grade 1 Mathematics — Subtraction facts to 20"
  verificable_en_codigo: true

- id: mat.numeros.signo_igual
  nombre:
    es: "El signo igual quiere decir que vale lo mismo"
  descripcion:
    es: "Entiende que = no significa «acá va la respuesta» sino que los dos lados valen igual: reconoce que 4 + 3 = 5 + 2 es cierto."
  materia: matematicas
  grado_sugerido: 1
  prerequisitos:
    - mat.resta.hechos_basicos
  alineacion:
    dba_colombia: "DBA Matemáticas 1° · #9"
    ebc_colombia: "EBC Matemáticas 1°-3° · «Reconozco y genero equivalencias entre expresiones numéricas»"
  verificable_en_codigo: true

- id: mat.problemas.incognita_en_cualquier_lugar
  nombre:
    es: "Cuando el número que falta no está al final"
  descripcion:
    es: "Resuelve problemas de la forma 4 + ? = 9 y ? + 3 = 8, no solo los de 4 + 5 = ?."
  materia: matematicas
  grado_sugerido: 1
  prerequisitos:
    - mat.numeros.signo_igual
  alineacion:
    dba_colombia: "DBA Matemáticas 1° · #2 — evidencia literal: «a + b = ?, a + ? = c, ? + b = c»"
    ebc_colombia: "EBC Matemáticas 1°-3° · «Resuelvo y formulo problemas en situaciones aditivas de composición y de transformación»"
  verificable_en_codigo: true

# ── 2° ──────────────────────────────────────────────────────────────────────

- id: mat.numeros.par_impar
  nombre:
    es: "Pares e impares"
  descripcion:
    es: "Reconoce si un número es par o impar, y sabe que los pares se pueden repartir en dos grupos iguales."
  materia: matematicas
  grado_sugerido: 2
  prerequisitos:
    - mat.numeros.conteo_saltado
  alineacion:
    # El DBA no nombra par/impar; el Estándar sí, literalmente. Se ancla donde está.
    ebc_colombia: "EBC Matemáticas 1°-3° · «Reconozco propiedades de los números (ser par, ser impar, etc.)»"
    core_knowledge: "Grade 2 Mathematics — Even and odd numbers"
  verificable_en_codigo: true

- id: mat.numeros.redondeo_decena
  nombre:
    es: "Redondear a la decena"
  descripcion:
    es: "Dice a qué decena está más cerca un número: 47 se redondea a 50, 43 a 40."
  materia: matematicas
  grado_sugerido: 2
  prerequisitos:
    - mat.numeros.comparar_ordenar
  alineacion:
    # ⚠️ Sin DBA que lo respalde (FUENTES.md §7.1). Se apoya solo en Core
