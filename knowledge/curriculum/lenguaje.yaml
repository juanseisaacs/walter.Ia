  descripcion:
    es: "Escribe una oración con sujeto y verbo que se entiende sola."
  materia: escritura
  grado_sugerido: 2
  prerequisitos:
    - esc.escritura.palabras
  alineacion:
    dba_colombia: "DBA Lenguaje 2° · #8"
