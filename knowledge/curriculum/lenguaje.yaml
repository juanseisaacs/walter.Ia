  alineacion:
    sin_anclaje: "El MEN no descompone la decodificación: no hay DBA de conciencia fonémica ni de sílabas (FUENTES.md §2.3). Core Knowledge tampoco sirve — su Language Arts es fonética inglesa y no transfiere al español. Secuencia de criterio propio."
  verificable_en_codigo: true

- id: esc.escritura.palabras
