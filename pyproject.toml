[project]
name = "rbh-tutor"
version = "0.1.0"
description = "Tutor AI adaptativo con método socrático para 1° a 5° de primaria"
requires-python = ">=3.11"

dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    "anthropic>=0.40",
    "google-genai>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tutor"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Los scripts llaman `load_dotenv()` ANTES de importar `tutor`: el paquete lee
# la configuración al importarse, así que mover esos imports arriba —que es lo
# que pide E402— los rompe. El orden es la funcionalidad, no un descuido.
"scripts/*.py" = ["E402", "I001"]
